# Both CLIs per platform embed the same northwood.efi, which
# carries the StelaGPU kext; the kext carries the Metal bundle and Stela.app.
# So the chain runs: Stela.app (macOS) -> northwood.efi (Linux) -> CLIs for
# Linux, Windows and macOS -> release.
#
# A pushed `v*` tag publishes a release. A `diag-*` tag publishes a
# diagnostics build as a prerelease. Scheduled and manual runs build
# downloadable artifacts with read-only permissions.
name: build and release

on:
  push:
    tags: ["v*", "diag-*"]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Stela.app's sources, with their build.sh.
  APP: guest/stela-app
  # The release body and each archive's INSTALL.txt. Plain text that also
  # reads as Markdown.
  ABOUT: |-
    Northwood uses Stela to boot Apple silicon macOS on x86-64 PCs. It is experimental.

    Requirements:

    - An x86-64-v2 CPU (about 2011 or newer), UEFI with Secure Boot off, 4 GB of RAM (8 GB or more recommended; under about 7 GB free, macOS gets 2 GB and runs slower).
    - An NVIDIA GTX 16 or RTX 20 series GPU or newer.
    - A USB stick of 8 GB or more.
    - An empty GPT partition of at least 60 GB.
    - Network access during the install, which downloads macOS.
  INSTALL: |-
    Install:

    1. Unpack the archive for your system.
    2. Run sudo ./northwood setup on Linux or macOS. On Windows, run northwood.exe setup or open stela.exe for the setup wizard.
    3. Choose the USB stick, the macOS version and the Mac model, then confirm. Setup erases the USB stick.
    4. Boot the PC from the USB stick.

    You are responsible for following Apple's software license agreement and terms of use.

jobs:
  upstream-merge:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the merge against Stela main
        run: |
          git fetch --no-tags https://github.com/tylertms/Stela.git refs/heads/main
          printf 'Northwood %s\nStela %s\n' "$(git rev-parse HEAD)" "$(git rev-parse FETCH_HEAD)"
          git merge-tree --write-tree HEAD FETCH_HEAD

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read workspace version and check release inputs
        id: version
        run: |
          version="$(awk '/^\[workspace.package\]/{s=1;next} s && /^\[/{exit} s && /^version = /{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Cargo.toml has no [workspace.package] version"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          for path in LICENSE NOTICE LICENSES LICENSING.md CREDITS.md; do
            if [[ ! -e "$path" ]]; then
              echo "::error::$path is missing; a release ships LICENSE, NOTICE and LICENSES/"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  app:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build Stela.app
        run: |
          swift --version
          # build.sh prints the bundle's path last.
          app="$(bash "$APP/build.sh" | tee /dev/stderr | tail -1)"
          [[ -f "$app/Contents/Info.plist" ]] || { echo "::error::$APP/build.sh named no app bundle: $app"; exit 1; }
          # tar keeps the bundle's modes and code signature byte for byte.
          tar -C "$(dirname "$app")" -cf Stela.app.tar Stela.app

      - uses: actions/upload-artifact@v4
        with:
          name: stela-app
          path: Stela.app.tar
          if-no-files-found: error
          retention-days: 7

  efi:
    needs: [version, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SOURCE: northwood-v${{ needs.version.outputs.version }}-source
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 21
        run: |
          # The kext needs upstream Clang 21 or newer for arm64e.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-21 lld-21 llvm-21 libclang-21-dev
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-efi-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/stela-boot/Cargo.lock') }}
          restore-keys: cargo-efi-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          version="$(clang --version)"
          echo "${version%%$'\n'*}"
          [[ "$version" =~ version\ (2[1-9]|[3-9][0-9])\. ]] || { echo "::error::clang on PATH is older than 21"; exit 1; }

      - name: Cache keys
        id: keys
        run: |
          pins="$(git ls-tree HEAD third_party | sha256sum | cut -c1-16)"
          tools="$(printf '%s\n%s\n' "$(clang --version | head -1)" "$(rustc --version)" | sha256sum | cut -c1-16)"
          echo "nvk=$pins-$tools" >> "$GITHUB_OUTPUT"
          # The tools' virtual environment names the image's Python.
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .tools/gpu
          key: gpu-tools-${{ steps.keys.outputs.image }}-${{ hashFiles('xtask/src/gpu/toolchain.rs') }}

      # Mesa and LLVM compiled for stela.efi. Only an exact key restores:
      # it covers every input of `target/gpu`.
      - uses: actions/cache@v4
        id: nvk
        with:
          path: target/gpu
          key: nvk-${{ steps.keys.outputs.nvk }}-${{ hashFiles('xtask/src/gpu/**', 'crates/stela-driver-gpu/**', 'third_party/patches/**', 'third_party/*.sparse') }}

      - uses: actions/download-artifact@v4
        with:
          name: stela-app
          path: app

      - name: Unpack Stela.app
        run: |
          tar -C app -xf app/Stela.app.tar
          echo "STELA_APP=$PWD/app/Stela.app" >> "$GITHUB_ENV"

      - name: Fetch upstream sources
        run: cargo xtask gpu fetch

      # The complete corresponding source: the tracked tree (with
      # third_party/patches) and each submodule's files at its pin, limited
      # to the sparse paths `gpu fetch` checks out. GitHub's tag archives
      # leave submodules out.
      - name: Source archive
        run: |
          export LC_ALL=C
          stage="$RUNNER_TEMP/source"
          rm -rf "$stage" && mkdir -p "$stage"
          git archive --format=tar --prefix="$SOURCE/" HEAD | tar -x -C "$stage"
          index="$RUNNER_TEMP/source.index"
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r _ path; do
            pin="$(git ls-files --stage -- "$path" | cut -d' ' -f2)"
            # Tracked files outside the sparse set are marked S (skip-worktree).
            git -C "$path" -c core.quotePath=false ls-files -v | sed -n 's/^[^S] //p' | sort > "$RUNNER_TEMP/sparse"
            git -C "$path" -c core.quotePath=false ls-tree -r --name-only "$pin" | sort > "$RUNNER_TEMP/pinned"
            comm -12 "$RUNNER_TEMP/sparse" "$RUNNER_TEMP/pinned" > "$RUNNER_TEMP/files"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git -C "$path" read-tree "$pin"
            GIT_INDEX_FILE="$index" git -C "$path" checkout-index --prefix="$stage/$SOURCE/$path/" --stdin < "$RUNNER_TEMP/files"
            echo "$path $pin: $(wc -l < "$RUNNER_TEMP/files") files"
          done
          mkdir -p dist
          tar -C "$stage" -cf - "$SOURCE" | zstd -q -T0 -15 -o "dist/$SOURCE.tar.zst"
          rm -rf "$stage" "$index"
          ls -l "dist/$SOURCE.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE }}
          path: dist/${{ env.SOURCE }}.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Keep the restored Mesa and LLVM build current
        if: steps.nvk.outputs.cache-hit == 'true'
        run: |
          # A fresh checkout is newer than the restored objects; the key
          # proved the sources the same, so date them before the objects.
          find third_party crates/stela-driver-gpu -path '*/.git' -prune -o -type f -print0 \
            | xargs -0 touch -h -d '2000-01-01T00:00:00Z'

      - name: Build northwood.efi
        run: |
          args=(--release)
          if [[ "$GITHUB_REF" == refs/tags/diag-* ]]; then
            args+=(--diagnostics)
          fi
          cargo xtask boot build "${args[@]}"
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::$efi is not a PE image"; exit 1; }
          cp "$efi" dist/northwood.efi
          ls -l dist/northwood.efi
          printf 'northwood.efi: %s bytes\nsha256 %s\n' \
            "$(stat -c %s dist/northwood.efi)" "$(sha256sum dist/northwood.efi | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: northwood-efi
          path: dist/northwood.efi
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: [version, efi]
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: Ubuntu 22.04, Debian 12, Fedora 36 and newer.
          - os: ubuntu-22.04
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: windows-2025
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
          - os: macos-26
            platform: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ARCHIVE: northwood-v${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Put LLVM on PATH
        run: |
          # Mbed TLS takes -mllvm --disable-select-optimize, LLVM 15 and newer.
          case "$RUNNER_OS" in
            Windows) printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH" ;;
            Linux)
              [[ -d /usr/lib/llvm-15/bin ]] || { sudo apt-get update -q && sudo apt-get install -y -q clang-15; }
              echo /usr/lib/llvm-15/bin >> "$GITHUB_PATH"
              ;;
          esac

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.targets }}
          rustc --version
          # stela-tls compiles Mbed TLS with clang on every host, and
          # archives it with llvm-lib for Windows.
          tools=clang
          [[ "$RUNNER_OS" == Windows ]] && tools="clang llvm-lib"
          for tool in $tools; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
          done
          clang --version | head -1

      - uses: actions/download-artifact@v4
        with:
          name: northwood-efi
          path: efi

      - name: Build both CLIs
        run: |
          export STELA_EFI="$PWD/efi/northwood.efi"
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked -p stela-cli -p northwood --features northwood/installer --target "$target"
          done
          mkdir -p "$ARCHIVE"
          for name in northwood stela; do
            case "$RUNNER_OS" in
              Windows) cp "target/x86_64-pc-windows-msvc/release/$name.exe" "$ARCHIVE/" ;;
              macOS)
                lipo -create -output "$ARCHIVE/$name" \
                  "target/aarch64-apple-darwin/release/$name" "target/x86_64-apple-darwin/release/$name"
                codesign --force --sign - "$ARCHIVE/$name"
                lipo -info "$ARCHIVE/$name"
                ;;
              *) cp "target/x86_64-unknown-linux-gnu/release/$name" "$ARCHIVE/" ;;
            esac
          done

      - name: Check both CLIs
        run: |
          python=python3
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then python=python; suffix=.exe; fi
          for name in northwood stela; do
            binary="$ARCHIVE/$name$suffix"
            expected="$name ${{ needs.version.outputs.version }}"
            actual="$("$binary" --version)"
            [[ "$actual" == "$expected" ]] || { echo "::error::$binary --version printed '$actual', not '$expected'"; exit 1; }
            "$python" -c 'import sys; sys.exit(open(sys.argv[1], "rb").read() not in open(sys.argv[2], "rb").read())' efi/northwood.efi "$binary" \
              || { echo "::error::$binary does not hold northwood.efi"; exit 1; }
            "$binary" setup --help >/dev/null
            printf '%s: %s bytes\n' "$binary" "$(wc -c < "$binary")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Package
        run: |
          printf '%s\n' "$INSTALL" > "$ARCHIVE/INSTALL.txt"
          cp -R LICENSE NOTICE LICENSES LICENSING.md CREDITS.md "$ARCHIVE/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip -bso0 "$ARCHIVE.zip" "$ARCHIVE"
          else
            tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
          ls -l "$ARCHIVE".*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/diag-'))
    needs: [version, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: northwood-v*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: northwood-efi
          path: dist

      - name: Checksums and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          for asset in northwood.efi "northwood-$tag-linux-x86_64.tar.gz" "northwood-$tag-windows-x86_64.zip" \
            "northwood-$tag-macos-universal.tar.gz" "northwood-$tag-source.tar.zst"; do
            [[ -s "dist/$asset" ]] || { echo "::error::missing $asset"; exit 1; }
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          # The first release lists no changes.
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            if [[ "$GITHUB_REF_NAME" == diag-* ]]; then
              echo "Diagnostic prerelease. The IdeaPad 1 15IGL7 has booted Diagnostics from a physical USB."
              echo "Internal Intel CNVi Wi-Fi association, complete macOS installation and installed boot are still under development."
              echo
            fi
            printf '%s\n\n' "$ABOUT"
            echo "Downloads:"
            echo
            echo "- Linux x86-64 (glibc 2.35 or newer): northwood-$tag-linux-x86_64.tar.gz"
            echo "- Windows x86-64: northwood-$tag-windows-x86_64.zip"
            echo "- macOS, Apple silicon and Intel: northwood-$tag-macos-universal.tar.gz"
            echo "- Source, with every submodule at its pin and Stela's patches: northwood-$tag-source.tar.zst"
            echo "- UEFI boot program: northwood.efi"
            echo "- SHA256SUMS: each file's SHA-256"
            echo
            printf '%s\n\n' "$INSTALL"
            echo "Northwood's source defaults to GPL-2.0-or-later. The UEFI boot program is distributed under GPL-2.0-only. Both CLI programs are distributed under GPL-3.0-or-later. See LICENSE, NOTICE, LICENSES/, LICENSING.md and CREDITS.md in the archives."
            if [[ -n "$previous" ]]; then
              total="$(git rev-list --count --no-merges "$previous..$GITHUB_REF_NAME")"
              echo
              echo "Changes since $previous:"
              echo
              git log --no-merges --format='- %s' -n 300 "$previous..$GITHUB_REF_NAME"
              if (( total > 300 )); then
                echo "- and $((total - 300)) earlier commits"
              fi
            fi
          } > notes.txt
          wc -l notes.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == diag-* ]]; then
            if gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease' > release-state.txt; then
              [[ "$(cat release-state.txt)" == true ]]
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.txt
              exit
            fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --prerelease --latest=false \
              --title "Northwood $GITHUB_REF_NAME" --notes-file notes.txt
            exit
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Northwood $GITHUB_REF_NAME" \
            --notes-file notes.txt
